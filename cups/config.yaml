---
version: 1.3.3
slug: cups
name: CUPS Print Server (BJNP)
description: CUPS print server
url: https://github.com/areast/cups-addon
arch:
  - aarch64
  - amd64
hassio_api: true
host_network: true
usb: true
map:
  - data:rw
  - share:rw
init: false
ports:
  631/tcp: 631
  631/udp: 631
ports_description:
  631/tcp: CUPS web interface and printing port
  631/udp: IPP browsing / AirPrint
options:
  admin_username: "admin"
  admin_password: "admin"
  printer_driver_deb: ""
schema:
  admin_username: str
  admin_password: password
  printer_driver_deb: str
startup: services
